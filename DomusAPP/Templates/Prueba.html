<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #333; margin-bottom: 20px; }
        .logo { height: 60px; float: left; }
        
        /* Estilos para Tablas */
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }

        /* Estilos para la Galería (Lo importante) */
        .galeria-titulo { margin-top: 30px; font-size: 18px; font-weight: bold; }
        .galeria-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); /* Auto-ajuste */
            gap: 15px;
            margin-top: 10px;
        }
        .foto-item { border: 1px solid #ccc; padding: 5px; text-align: center; }
        .foto-item img { width: 100%; height: 120px; object-fit: cover; }
        .foto-desc { font-size: 12px; color: #555; }
    </style>
</head>
<body>
    <div class="header">
        <img src="@LOGO_URL@" class="logo" />
        <h1>Reporte de Inspección</h1>
        <p>Fecha: @FECHA@ | Cliente: @CLIENTE@</p>
    </div>

    <h3>Detalles del Reporte</h3>
    <p>@DESCRIPCION_GENERAL@</p>

    <h3>Datos Técnicos</h3>
    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Valor</th>
                <th>Estado</th>
            </tr>
        </thead>
        <tbody>
            @FILAS_TABLA@
        </tbody>
    </table>

    <div class="galeria-titulo">Anexos Fotográficos</div>
    <div class="galeria-container">
        @IMAGENES_GALERIA@
    </div>
</body>
</html>
